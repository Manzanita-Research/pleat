name: Package Preview

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pkg/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/pkg.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'pkg/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/pkg.yml'

permissions:
  contents: read

concurrency:
  group: pkg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Packing is checked before registry setup; only a configured URL publishes.
  PKG_REGISTRY: ${{ vars.PKG_REGISTRY || 'https://preview.invalid' }}

jobs:
  publish:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The registry verifies the PR head, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and pack packages
        id: pack
        run: pnpm pkg:pack
      - name: Vouch for the manifest
        if: vars.PKG_REGISTRY != '' && steps.pack.outputs.package-count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact-name }}
          path: pkg/.pkg/pkg-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Publish packages
        if: vars.PKG_REGISTRY != '' && steps.pack.outputs.package-count != '0'
        run: pnpm pkg:publish
