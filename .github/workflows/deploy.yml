name: Deploy

# Deploys the docs site to Cloudflare with the Alchemy stack in infra/.
# Needs the repository secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - name: Check that Cloudflare credentials are set
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Set the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets first."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infra install --frozen-lockfile
      - run: pnpm --dir infra exec alchemy deploy --stage prod
